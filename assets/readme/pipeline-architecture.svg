<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Writing Boost v3.2 Pipeline</title>
  <desc id="desc">User alignment flows through evidence, shape, draft loops, self review, two-reviewer final review, main session synthesis, and delivery.</desc>
  <rect width="1200" height="560" rx="24" fill="#0f172a"/>
  <text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Writing pipeline</text>

  <g font-family="sans-serif" font-size="18" fill="#e2e8f0">
    <rect x="60" y="105" width="190" height="70" rx="12" fill="#1e293b"/>
    <text x="93" y="135">Alignment Card</text>
    <text x="83" y="160" font-size="13" fill="#94a3b8">POV · facts · length · loops</text>

    <rect x="300" y="105" width="150" height="70" rx="12" fill="#1e293b"/>
    <text x="342" y="147">Evidence</text>

    <rect x="500" y="105" width="150" height="70" rx="12" fill="#1e293b"/>
    <text x="548" y="147">Shape ↻</text>

    <rect x="700" y="105" width="150" height="70" rx="12" fill="#1e293b"/>
    <text x="752" y="147">Draft ↻</text>

    <rect x="900" y="105" width="220" height="70" rx="12" fill="#1e293b"/>
    <text x="944" y="135">Self-review ↻</text>
    <text x="936" y="160" font-size="13" fill="#94a3b8">facts · style · deslop</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none">
    <path d="M250 140 H300"/>
    <path d="M450 140 H500"/>
    <path d="M650 140 H700"/>
    <path d="M850 140 H900"/>
    <path d="M1010 175 V235"/>
  </g>

  <rect x="290" y="235" width="620" height="190" rx="18" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="505" y="270" font-family="sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Final Review</text>
  <rect x="345" y="305" width="230" height="75" rx="12" fill="#1e293b"/>
  <rect x="625" y="305" width="230" height="75" rx="12" fill="#1e293b"/>
  <text x="381" y="337" font-family="sans-serif" font-size="18" fill="#e2e8f0">Integrity Reviewer</text>
  <text x="369" y="360" font-family="sans-serif" font-size="13" fill="#94a3b8">facts · timeline · quotes</text>
  <text x="655" y="337" font-family="sans-serif" font-size="18" fill="#e2e8f0">Editorial Reviewer</text>
  <text x="662" y="360" font-family="sans-serif" font-size="13" fill="#94a3b8">reader · style · pacing</text>
  <text x="430" y="405" font-family="sans-serif" font-size="14" fill="#94a3b8">0 / 1 / 2 reviewers per round · never more than 2</text>

  <path d="M600 425 V470" stroke="#64748b" stroke-width="3"/>
  <rect x="405" y="470" width="390" height="60" rx="12" fill="#1e293b"/>
  <text x="455" y="507" font-family="sans-serif" font-size="18" fill="#e2e8f0">Main Session → Delivery / Packaging</text>
</svg>
